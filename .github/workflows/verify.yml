# The gate, run somewhere that is not the author's laptop.
#
# Three jobs, deliberately separate because they answer different questions:
#
#   attest  — is the claim true?   Does a recorded verify run cover this exact
#             committed content, and are the append-only files still append-only?
#   verify  — is the code good?    ./verify.sh, from a clean checkout.
#   witness — is the gate real?    check-verify.mjs, which runs verify.sh against
#             a deliberate error. It cannot be a verify.sh step without recursing,
#             so CI is the only place it runs unattended.
#
# `attest` is the one that could not exist before verify-log.jsonl was tracked.
# Locally the record is a session reporting on itself; recomputed here, by
# something that did not write it, it is a claim that can fail.
#
# This file travels: the generator copies it into every new project unchanged.
# Nothing in it may name a product, a secret, or a tool the gate does not
# call. A project that adds a database gets Postgres from its docker-compose.yml,
# started by verify.sh itself, so there is no services: block to add here.

name: verify

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '0 4 * * 1'

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # A pull_request checkout defaults to a merge commit, whose tree matches no
  # recorded run. Every job checks out the real head instead.
  CHECKOUT_REF: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  attest:
    name: attestation and append-only guards
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.CHECKOUT_REF }}
          fetch-depth: 0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc

      # A spike branch proves nothing and cannot reach main (I16). Its pushes
      # run nothing here — the workflow triggers on main and on pull requests —
      # and a pull request from one is refused before anything is walked, with
      # the same sentence check-pr-ready.mjs gives on the machine.
      - name: A pull request from a spike branch is refused
        if: github.event_name == 'pull_request'
        run: node scripts/spike.mjs check --branch "${{ github.head_ref }}" --base "${{ github.base_ref }}"

      # Deliberately before any install: the tree hash is over tracked files,
      # and this proves it is checkable with nothing but a clone and node.
      - name: This commit must carry a passing recorded run of its own content
        run: node scripts/check-attestation.mjs

      # Append-only is a property of each commit against its parent, not of a
      # span. Appending an entry in one commit and flipping its `passes` in the
      # next is exactly correct, and the two collapse into "an entry born
      # passing" the moment they are compared as a single diff.
      - name: The append-only files stay append-only, commit by commit
        run: |
          set -euo pipefail

          if [ "${{ github.event_name }}" = "pull_request" ]; then
            git fetch -q --no-tags origin "${{ github.base_ref }}"
            base="$(git merge-base "origin/${{ github.base_ref }}" "$CHECKOUT_REF")"
          else
            base="${{ github.event.before }}"
            if [ -z "$base" ] || ! git cat-file -e "${base}^{commit}" 2>/dev/null; then
              # A first push, a new branch, or a force-push: there is no pushed
              # range. Comparing across the whole span would collapse correct
              # two-commit sequences into a violation, and the seed commit of a
              # repository predates any run. Say so and check nothing.
              echo "::notice::no pushed range (first push or force-push) — nothing to check"
              exit 0
            fi
          fi

          commits="$(git rev-list --reverse "${base}..${CHECKOUT_REF}")"
          if [ -z "$commits" ]; then
            echo "::notice::no new commits since ${base}"
            exit 0
          fi

          for commit in $commits; do
            echo "--- $(git log -1 --format='%h %s' "$commit")"
            # A merge commit is compared with the branch it merged, not with
            # the main it landed on. Its own commits were each walked above;
            # against the first parent, seven legal commits collapse into "an
            # entry born passing", and main went red on the first merge that
            # closed anything, 2026-09-11. Against the second parent a clean
            # merge is an empty diff, and a conflict resolution shows as
            # exactly the edit it made.
            parent="${commit}^"
            if git rev-parse --verify --quiet "${commit}^2" >/dev/null; then
              parent="${commit}^2"
            fi
            node scripts/check-feature-list.mjs --at "$commit" --base "$parent"
            node scripts/verify-log.mjs check --at "$commit" --base "$parent"
            node scripts/check-migrations.mjs --at "$commit" --base "$parent"
            # The journal's Evidence points into the record: every entry a
            # commit adds names a run under verify-log/, and an audit under
            # audit-log/ when it closed something. Since 2026-09-16.
            node scripts/progress.mjs check --at "$commit" --base "$parent"
          done

  verify:
    name: ./verify.sh
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.CHECKOUT_REF }}

      # Reads `packageManager` from package.json; the generator writes it.
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      # --frozen-lockfile is the point of running install here at all: it fails
      # if pnpm-lock.yaml does not match package.json, which no local run checks.
      - run: pnpm install --frozen-lockfile

      # Nothing local looks at advisories, and --frozen-lockfile only proves the
      # lockfile matches package.json — not that what it pins is safe. Blocking
      # on high and critical only: a moderate advisory in a transitive dev
      # dependency turning main red is how an audit step gets switched off.
      - run: pnpm audit --audit-level=high

      # verify.sh sources .env when present and falls back to the configured
      # values otherwise. CI has no .env, deliberately: a gate that needs one
      # is a gate that passes with somebody's private settings.
      - run: ./verify.sh

      - name: Keep the evidence, especially for a failing run
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: evidence-${{ github.run_id }}
          path: .generated/runs/
          retention-days: 30
          # .generated is a dot directory, and upload-artifact skips hidden
          # files by default. Without this the step succeeds and uploads
          # nothing -- the artifact was empty on the first run and said so
          # only in a warning.
          include-hidden-files: true

  witness:
    name: check-verify (the gate's own witness)
    # Runs verify.sh three times, one of them against a deliberately broken
    # tree. The question it answers — does the gate still fail when it should
    # — changes rarely, so it runs weekly and on demand rather than on every
    # push. Three full runs was the wrong price for a question nobody had
    # changed the answer to since it was written.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.CHECKOUT_REF }}

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: node scripts/check-verify.mjs

      - name: Keep the evidence from all three runs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: witness-evidence-${{ github.run_id }}
          path: .generated/runs/
          retention-days: 30
          include-hidden-files: true
