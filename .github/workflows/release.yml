# Publishing, from a tag and from nowhere else.
#
# A version reaches npm when a tag `v<version>` is pushed, and only if the
# tag names the version in package.json, the commit carries an attested
# passing run, and the gate is green again on this runner.
#
# No token. npm's trusted publishing lets this workflow, named on the
# package's settings page at npmjs.com, publish with a credential GitHub
# mints for this one run; `id-token: write` is what lets it ask for one, and
# `--provenance` records which workflow of which repository built the
# tarball, so a consumer can check that what they installed came from this
# file rather than from somebody's machine.
#
# The first version could not go this way: a trusted publisher is configured
# on a package that exists, and a bypass-2FA token cannot create one since
# 2026-08. 0.1.0 was published once by a person with 2FA, from the tagged
# commit after a green gate — a visible act, and the only one of its kind.
#
# This workflow is this repository's and does not travel: package.json's
# `files` excludes it, and a generated project has nothing to publish.

name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    name: npm publish --provenance
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
          registry-url: https://registry.npmjs.org

      # Trusted publishing needs npm 11.5.1 or later, and the npm that ships
      # with the pinned node is older. Pinned: a release pipeline that installs
      # "latest" of anything trusts whatever was published a minute ago. An
      # 11.x, because npm 12 wants a newer node than .nvmrc pins, and the tag
      # v0.1.2 found that out on the runner rather than here.
      - run: npm install -g npm@11.19.1 && npm --version

      - name: The tag must name the version package.json says
        run: |
          set -euo pipefail
          version="$(node -p "require('./package.json').version")"
          tag="${GITHUB_REF_NAME#v}"
          if [ "$tag" != "$version" ]; then
            echo "::error::tag v${tag} does not match package.json version ${version}"
            exit 1
          fi
          if ! grep -q "^## \[${version}\]" CHANGELOG.md; then
            echo "::error::CHANGELOG.md has no entry for ${version}"
            exit 1
          fi

      # The same question CI's attest job asks of every commit, asked again of
      # the one being published: a tag can be put on any commit.
      - run: node scripts/check-attestation.mjs

      - run: pnpm install --frozen-lockfile

      - run: ./verify.sh

      - run: npm publish --provenance --access public
